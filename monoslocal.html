<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Monos: Ciclo de 10s</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #121212;
        color: #e0e0e0;
        font-family: "Segoe UI", sans-serif;
      }

      /* Header Arriba */
      header {
        width: 100%;
        background-color: #1e1e24;
        padding: 20px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .header-left h1 {
        margin: 0;
        color: #00ff88;
        font-size: 2rem;
      }

      .header-right {
        display: flex;
        gap: 30px;
      }

      .stat-item {
        background-color: #2a2a35;
        padding: 10px 20px;
        border-radius: 8px;
        text-align: center;
      }

      .stat-label {
        font-size: 0.8rem;
        color: #888;
        display: block;
      }

      .stat-value {
        font-size: 1.4rem;
        font-weight: bold;
        color: #fff;
        font-family: monospace;
      }

      .stat-value.red {
        color: #ff4444;
      }

      /* Botones */
      .controls {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-top: 30px;
      }

      button {
        padding: 12px 30px;
        font-size: 1.1rem;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-weight: bold;
        transition: transform 0.1s;
      }

      #btn-start {
        background-color: #238636;
        color: white;
      }

      #btn-start:hover {
        background-color: #2ea043;
        transform: scale(1.05);
      }

      #btn-start:disabled {
        background-color: #3a3d41;
        cursor: not-allowed;
        opacity: 0.7;
      }

      #btn-stop {
        background-color: #da3633;
        color: white;
      }

      #btn-stop:hover {
        background-color: #f85149;
        transform: scale(1.05);
      }

      #btn-stop:disabled {
        background-color: #3a3d41;
        cursor: not-allowed;
        opacity: 0.7;
      }

      /* Barra de Estado */
      .status-bar {
        width: 90%;
        max-width: 800px;
        height: 40px;
        background-color: #000;
        border-bottom: 1px solid #333;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-top: 20px;
      }

      .status-text {
        font-size: 1.3rem;
        letter-spacing: 2px;
        text-transform: uppercase;
      }

      /* Grid de Monos */
      .grid-container {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
        gap: 15px;
        padding: 20px;
        width: 90%;
        max-width: 1000px;
      }

      .monkey-card {
        background-color: #2a2a35;
        border-radius: 10px;
        padding: 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        min-height: 100px;
        transition: all 0.3s ease;
        position: relative;
        border: 2px solid #444;
      }

      /* Clases de Color (Los bordes cambian según el saldo) */
      .c-10000 {
        border-color: #ff00ff;
        box-shadow: 0 0 15px rgba(255, 0, 255, 0.4);
      }

      /* Fuchsia */
      .c-5000 {
        border-color: #8b00ff;
        box-shadow: 0 0 15px rgba(139, 0, 255, 0.4);
      }

      /* Morado */
      .c-2000 {
        border-color: #00bfff;
        box-shadow: 0 0 15px rgba(0, 191, 255, 0.4);
      }

      /* Azul */
      .c-1500 {
        border-color: #7cfc00;
        box-shadow: 0 0 15px rgba(124, 252, 0, 0.4);
      }

      /* Verde Brillo */
      .c-1100 {
        border-color: #90ee90;
        box-shadow: 0 0 15px rgba(144, 238, 144, 0.4);
      }

      /* Verde Claro */
      .c-900 {
        border-color: #ffff00;
        box-shadow: 0 0 15px rgba(255, 255, 0, 0.4);
      }

      /* Amarillo */
      .c-300 {
        border-color: #ff8c00;
        box-shadow: 0 0 15px rgba(255, 140, 0, 0.4);
      }

      /* Naranja */
      .c-0 {
        background-color: #000;
        border-color: #333 !important;
        box-shadow: none !important;
      }

      /* Muerto */
      .c-0 .monkey-emoji {
        opacity: 0.3;
      }

      /* Animación de Gana/Pierde */
      .anim-win {
        border-color: #00ff88 !important;
        box-shadow: 0 0 30px #00ff88 !important;
        transform: scale(1.2);
        z-index: 100;
      }

      .anim-lose {
        border-color: #ff4444 !important;
        box-shadow: 0 0 30px #ff4444 !important;
        transform: scale(0.9);
        opacity: 0.6;
      }

      .monkey-emoji {
        font-size: 2.5rem;
        margin-bottom: 10px;
        transition: transform 0.3s;
      }

      .monkey-id {
        font-size: 0.7rem;
        color: #888;
        margin-bottom: auto;
      }

      .monkey-balance {
        font-size: 1.3rem;
        font-weight: bold;
        color: white;
        margin-bottom: 5px;
      }

      .monkey-dead-msg {
        font-size: 0.8rem;
        color: #ff4444;
        font-weight: bold;
        background-color: rgba(0, 0, 0, 0.5);
        padding: 2px;
        border-radius: 4px;
        min-height: 1.5em;
      }
    </style>
  </head>

  <body>
    <header>
      <div class="header-left">
        <h1>Coliseo de Monos</h1>
      </div>
      <div class="header-right">
        <div class="stat-item">
          <span class="stat-label">Partidas Totales</span>
          <span id="total-bets" class="stat-value">0</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Monos Vivos</span>
          <span id="alive-count" class="stat-value">100</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Ronda Actual</span>
          <span id="round-count" class="stat-value">0</span>
        </div>
      </div>
    </header>

    <div class="controls">
      <button type="button" id="btn-start" onclick="startGame()">
        ▶ INICIAR SIMULACIÓN
      </button>
      <button type="button" id="btn-stop" onclick="stopGame()" disabled>
        ⏸ DETENER
      </button>

      <!-- Nuevo Slider de Velocidad -->
      <div style="display: flex; flex-direction: column; align-items: center; margin-left: 20px;">
        <label for="speed-slider" style="margin-bottom: 5px; color: #888;">Apuestas por Ronda: <span id="speed-val" style="color: #fff; font-weight: bold;">500,000</span></label>
        <input type="range" id="speed-slider" min="500000" max="10000000" step="500000" value="500000" style="width: 200px;">
      </div>
    </div>

    <div class="status-bar">
      <span id="system-status" class="status-text">Esperando Inicio...</span>
    </div>

    <div class="grid-container" id="monkey-grid">
      <!-- Los 100 monos se generan aquí -->
    </div>

    <script>
      // Configuración (MODO ACELERADO 500k/3s)
      const INITIAL_BALANCE = 1000;
      const TOTAL_MONKEYS = 100;
      const TIME_PER_ROUND_MS = 3000;  // 3 segundos de cálculo
      const PAUSE_TIME_MS = 1000;      // 1 segundo de pausa visual
      let TARGET_BETS_PER_ROUND = 500000;

      // Variables Globales
      let monkeys = [];
      let totalBetsCounter = 0;
      let roundNumber = 0;
      let isPlaying = false;
      let animationTimer = null;

      // Elementos DOM
      const btnStart = document.getElementById("btn-start");
      const btnStop = document.getElementById("btn-stop");
      const elStatus = document.getElementById("system-status");
      const gridEl = document.getElementById("monkey-grid");
      const elTotalBets = document.getElementById("total-bets");
      const elAliveCount = document.getElementById("alive-count");
      const elRoundCount = document.getElementById("round-count");

      const sliderEl = document.getElementById("speed-slider");
      const sliderValEl = document.getElementById("speed-val");

      // Evento del slider
      sliderEl.oninput = function() {
          TARGET_BETS_PER_ROUND = parseInt(this.value);
          sliderValEl.textContent = TARGET_BETS_PER_ROUND.toLocaleString();
      };

      // Función unificada para visuales (Color y Emoji)
      function getMonkeyVisuals(balance) {
        if (balance <= 0) return { className: "c-0", emoji: "💀" };
        if (balance > 10000) return { className: "c-10000", emoji: "🚀" };
        if (balance > 5000) return { className: "c-5000", emoji: "👑" };
        if (balance > 2000) return { className: "c-2000", emoji: "🤑" };
        if (balance > 1500) return { className: "c-1500", emoji: "😀" };
        if (balance >= 1100) return { className: "c-1100", emoji: "🙂" };
        if (balance >= 900) return { className: "c-900", emoji: "🐵" };
        if (balance >= 300) return { className: "c-300", emoji: "😨" };
        return { className: "c-300", emoji: "😭" };
      }

      // Inicializar Monos
      function initMonkeys() {
        gridEl.innerHTML = "";
        monkeys = [];

        for (let i = 0; i < TOTAL_MONKEYS; i++) {
          const monkeyData = {
            id: i,
            balance: INITIAL_BALANCE,
            isDead: false,
            deadRound: null,
          };
          monkeys.push(monkeyData);

          const card = document.createElement("div");
          card.className = "monkey-card";
          card.id = `card-${i}`;

          const visuals = getMonkeyVisuals(INITIAL_BALANCE);

          card.innerHTML = `
                    <div class="monkey-emoji" id="face-${i}">${visuals.emoji}</div>
                    <div class="monkey-id">Mono #${i + 1}</div>
                    <div class="monkey-balance" id="bal-${i}">€${INITIAL_BALANCE.toLocaleString()}</div>
                    <div class="monkey-dead-msg" id="msg-${i}"></div>
                `;

          gridEl.appendChild(card);
          // Establecer clase inicial
          card.classList.add(visuals.className);
        }

        updateUI();
      }

      function updateUI() {
        // Actualizar contador de partidas (con formatos de miles)
        elTotalBets.textContent = totalBetsCounter.toLocaleString();

        // Contar vivos
        const alive = monkeys.filter((m) => !m.isDead).length;
        elAliveCount.textContent = alive;

        if (alive === 0) {
          stopGame();
          elStatus.textContent = "EXTINCIÓN TOTAL - No quedan monos";
        }
      }

      function setBalance(monkeyId, amount) {
        const el = document.getElementById(`bal-${monkeyId}`);
        if (el) {
          el.textContent = `€${amount.toLocaleString()}`;

          const card = document.getElementById(`card-${monkeyId}`);
          const face = document.getElementById(`face-${monkeyId}`);
          const msg = document.getElementById(`msg-${monkeyId}`);

          const visuals = getMonkeyVisuals(amount);

          // Actualizar emoji
          face.textContent = visuals.emoji;

          // Remover clases de color anteriores
          const classesToRemove = [
            "c-10000",
            "c-5000",
            "c-2000",
            "c-1500",
            "c-1100",
            "c-900",
            "c-300",
            "c-0",
          ];
          classesToRemove.forEach((c) => card.classList.remove(c));

          // Añadir nueva clase
          card.classList.add(visuals.className);

          if (amount <= 0) {
            msg.textContent = "FALLIDO";
          } else {
            msg.textContent = "";
          }
        }
      }

      function setStatus(text, type) {
        elStatus.textContent = text;
        if (type === "play") elStatus.style.color = "#00ff88";
        else if (type === "pause") elStatus.style.color = "#ff4444";
        else elStatus.style.color = "#fff";
      }

      // Lógica Principal
      function startGame() {
        if (isPlaying) return;

        isPlaying = true;
        btnStart.disabled = true;
        btnStop.disabled = false;

        playRounds();
      }

      function stopGame() {
        isPlaying = false;
        btnStart.disabled = false;
        btnStop.disabled = true;
        elStatus.textContent = "Sistema Detenido";
      }

      function playRounds() {
        if (!isPlaying) return;

        roundNumber++;
        elRoundCount.textContent = roundNumber;

        setStatus(
          `JUGANDO RONDA #${roundNumber}... (Simulando ${TARGET_BETS_PER_ROUND.toLocaleString()} apuestas)`,
          "play",
        );

        let startTime = Date.now();
        let roundBetsCount = 0;

        // Intervalo de 16ms
        let simulationTimer = setInterval(() => {
          if (!isPlaying) {
            clearInterval(simulationTimer);
            return;
          }

          const currentTime = Date.now();
          const elapsedTime = currentTime - startTime;

          // Si llegamos a la meta de apuestas O al tiempo límite (3s)
          if (
            roundBetsCount >= TARGET_BETS_PER_ROUND ||
            elapsedTime >= TIME_PER_ROUND_MS
          ) {
            clearInterval(simulationTimer);
            showResults(roundBetsCount);
            return;
          }

          // CALIBRACIÓN DE VELOCIDAD DINÁMICA
          // Objetivo: TARGET_BETS_PER_ROUND apuestas en 3000ms (TIME_PER_ROUND_MS)

          // Frames aproximados en 3s a 60fps = 180 frames (usamos 187 para 16ms)
          // Total apuestas por frame = TARGET / 187
          // Iteraciones por mono = Total apuestas por frame / 100

          const framesInRound = TIME_PER_ROUND_MS / 16;
          const betsPerFrame = TARGET_BETS_PER_ROUND / framesInRound;
          let iterationsPerMonkey = Math.ceil(betsPerFrame / TOTAL_MONKEYS);

          // Clamp mínimo de 1
          if (iterationsPerMonkey < 1) iterationsPerMonkey = 1;

          const SPEED_MULTIPLIER = iterationsPerMonkey;

          for (let i = 0; i < SPEED_MULTIPLIER; i++) {
            // Si ya nos pasamos de la meta, cortamos
            if (roundBetsCount >= TARGET_BETS_PER_ROUND) break;

            const worldCoin = Math.random() < 0.5 ? 0 : 1;

            monkeys.forEach((monkey) => {
              if (!monkey.isDead) {
                const guess = Math.random() < 0.5 ? 0 : 1;

                if (guess === worldCoin) {
                  monkey.balance += 1;
                } else {
                  monkey.balance -= 1;
                }

                if (monkey.balance <= 0) {
                  monkey.balance = 0;
                  monkey.isDead = true;
                  monkey.deadRound = roundNumber;
                }
                roundBetsCount++;
              }
            });
          }
        }, 16);
      }

      function showResults(betsInRound) {
        // FASE 2: PAUSA Y RESULTADOS (2.5 SEGUNDOS)

        // Actualizar UI final
        totalBetsCounter += betsInRound;
        updateUI();

        setStatus(
          `RONDA #${roundNumber} FINALIZADA. Apuestas: ${betsInRound.toLocaleString()}. Viendo resultados...`,
          "pause",
        );

        // 1. ACTUALIZACIÓN VISUAL MASIVA
        // Ahora actualizamos el DOM de TODOS los monos aquí, ya que no se hizo durante el juego
        monkeys.forEach((monkey) => {
          const card = document.getElementById(`card-${monkey.id}`);

          // Actualizar estado visual completo (Color y Emoji)
          // Esto maneja también a los monos que murieron durante esta ronda rápida
          setBalance(monkey.id, monkey.balance);

          if (!monkey.isDead) {
            // Animación visual (Brillo) solo para vivos
            if (monkey.balance > 1000) {
              card.classList.add("anim-win");
            } else if (monkey.balance < 1000) {
              card.classList.add("anim-lose");
            }
          } else {
             // Asegurar que los muertos tengan su clase correcta
             card.classList.add("c-0");
          }
        });

        // Esperar 2.5 segundos
        setTimeout(() => {
          // Limpiar animaciones de brillo para la siguiente ronda
          document.querySelectorAll(".monkey-card").forEach((card) => {
            card.classList.remove("anim-win", "anim-lose");
          });

          // Mensaje de cuándo murió cada mono (solo en la ronda actual)
          const deadInRound = monkeys.filter(
            (m) => m.deadRound === roundNumber,
          );

          if (deadInRound.length > 0) {
            elStatus.innerHTML += `<br><span style="color:#ff4444">⚠️ ${deadInRound.length} MONOS FALLECIERON EN ESTA RONDA</span>`;
          } else {
            elStatus.innerHTML += `<br><span style="color:#fff">Ningún mono falleció en esta ronda.</span>`;
          }

          // Pequeña pausa para leer el mensaje antes de reiniciar
          setTimeout(() => {
            playRounds(); // Volver a jugar
          }, 1000);
        }, PAUSE_TIME_MS);
      }

      // Inicializar al cargar
      initMonkeys();
    </script>
  </body>
</html>
```
