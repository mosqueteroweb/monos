<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:;"
    />
    <title>Battle Royale: Cara o Cruz</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="logger.js"></script>
  </head>
  <body>
    <header>
      <h1>
        BATTLE ROYALE
        <a
          href="webworker.html"
          class="worker-link"
          title="Versión con Web Worker para mejor rendimiento"
          >Versión Worker →</a
        >
      </h1>
      <div class="controls">
        <span class="money-counter" id="totalMoney">0€</span>
        <div class="slider-container" title="Velocidad de Simulación">
          <input
            type="range"
            id="speedSlider"
            min="100"
            max="10000"
            step="100"
            value="1000"
          />
        </div>
        <div class="btn-group">
          <button id="playPauseBtn" title="Iniciar/Pausar">
            <!-- Play Icon -->
            <svg id="icon-play" viewBox="0 0 24 24">
              <path d="M8 5v14l11-7z" />
            </svg>
            <!-- Pause Icon (hidden by default) -->
            <svg id="icon-pause" viewBox="0 0 24 24" class="hidden">
              <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
            </svg>
          </button>
          <button id="resetBtn" title="Reiniciar">
            <!-- Reset Icon -->
            <svg viewBox="0 0 24 24">
              <path
                d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"
              />
            </svg>
          </button>
          <button id="statsBtn" title="Ver Estadísticas">
            <!-- Stats Icon -->
            <svg viewBox="0 0 24 24">
              <path d="M10 20h4V4h-4v16zm-6 0h4v-8H4v8zM16 9v11h4V9h-4z" />
            </svg>
          </button>
        </div>
      </div>
    </header>

    <main>
      <canvas id="gameCanvas"></canvas>
      <div id="tooltip"></div>
    </main>

    <div id="statsPanel">
      <div class="stats-header">
        <span class="match-counter"
          >Matches: <span id="matchCount">0</span></span
        >
      </div>

      <div class="progress-container">
        <div id="pb-ruined" class="progress-bar pb-ruined"></div>
        <div id="pb-losing" class="progress-bar pb-losing"></div>
        <div id="pb-neutral" class="progress-bar pb-neutral"></div>
        <div id="pb-winning" class="progress-bar pb-winning"></div>
      </div>

      <div class="stats-grid">
        <div class="stat-item">
          <span class="dot dot-ruined"></span>Arruinados (0€)<span
            class="stat-value"
            id="stat-ruined"
            >0 (0%)</span
          >
        </div>
        <div class="stat-item">
          <span class="dot dot-losing"></span>Perdiendo (<900)<span
            class="stat-value"
            id="stat-losing"
            >0 (0%)</span
          >
        </div>
        <div class="stat-item">
          <span class="dot dot-neutral"></span>Neutro (900-1100)<span
            class="stat-value"
            id="stat-neutral"
            >0 (0%)</span
          >
        </div>
        <div class="stat-item">
          <span class="dot dot-winning"></span>Ganando (>1100)<span
            class="stat-value"
            id="stat-winning"
            >0 (0%)</span
          >
        </div>
        <div class="stat-item">
          <span class="dot dot-x2"></span>x2 (>2k)<span
            class="stat-value"
            id="stat-x2"
            >0 (0%)</span
          >
        </div>
        <div class="stat-item">
          <span class="dot dot-x3"></span>x3 (>3k)<span
            class="stat-value"
            id="stat-x3"
            >0 (0%)</span
          >
        </div>
        <div class="stat-item">
          <span class="dot dot-x5"></span>x5 (>5k)<span
            class="stat-value"
            id="stat-x5"
            >0 (0%)</span
          >
        </div>
        <div class="stat-item">
          <span class="dot dot-x10"></span>x10 (>10k)<span
            class="stat-value"
            id="stat-x10"
            >0 (0%)</span
          >
        </div>
      </div>
    </div>

    <script src="game.js" defer></script>
  </body>
</html>
