<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Battle Royale: Cara o Cruz (Web Worker)</title>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0a0;
            --accent-color: #bb86fc;
            --success-color: #00e676; /* Neon Green */
            --warning-color: #ffea00;
            --danger-color: #ff1744;
            --ruined-color: #37474f; /* Dark Grey */
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* HEADER */
        header {
            background-color: var(--surface-color);
            padding: 10px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
            z-index: 100;
            flex-shrink: 0;
        }

        h1 {
            font-size: 1.1rem;
            font-weight: 700;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .back-link {
            font-size: 0.8rem;
            text-decoration: none;
            color: var(--text-secondary);
            border: 1px solid #444;
            padding: 4px 8px;
            border-radius: 4px;
            transition: all 0.2s;
        }

        .back-link:hover {
            color: var(--text-primary);
            border-color: var(--text-primary);
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* SLIDER */
        .slider-container {
            display: flex;
            align-items: center;
            width: 100px;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 14px;
            width: 14px;
            border-radius: 50%;
            background: var(--text-primary);
            cursor: pointer;
            margin-top: -5px;
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #444;
            border-radius: 2px;
        }

        /* BUTTONS */
        .btn-group {
            display: flex;
            gap: 8px;
        }

        button {
            background: #2c2c2c;
            border: 1px solid #444;
            color: var(--text-primary);
            border-radius: 6px;
            padding: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            width: 36px;
            height: 36px;
        }

        button:hover {
            background: #3d3d3d;
            border-color: #666;
        }

        button:active {
            transform: scale(0.95);
        }

        button svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        button.active {
             background: var(--accent-color);
             color: #000;
             border-color: var(--accent-color);
        }

        /* MAIN CONTENT */
        main {
            flex: 1;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #gameCanvas {
            flex: 1;
            width: 100%;
            display: block;
            background-color: #000;
        }

        /* STATS PANEL (Bottom) */
        #statsPanel {
            background-color: var(--surface-color);
            border-top: 1px solid #333;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            /* Scrollable if content overflows on small screens */
            overflow-y: auto;
            max-height: 40vh;
            flex-shrink: 0;
        }

        .stats-header {
            display: flex;
            justify-content: center;
            margin-bottom: 5px;
        }

        .match-counter {
            font-size: 1.2rem;
            color: var(--success-color);
            font-family: 'Courier New', monospace;
            font-weight: bold;
        }

        .money-counter {
            font-size: 1.1rem;
            color: var(--accent-color);
            font-family: 'Courier New', monospace;
            font-weight: bold;
            margin-right: 15px;
        }

        /* PROGRESS BAR */
        .progress-container {
            width: 100%;
            height: 12px;
            background-color: #333;
            border-radius: 6px;
            overflow: hidden;
            display: flex;
        }

        .progress-bar {
            height: 100%;
            transition: width 0.3s ease;
        }

        .pb-ruined { background-color: #37474f; }
        .pb-losing { background-color: #ff9800; }
        .pb-neutral { background-color: #ffeb3b; }
        .pb-winning { background-color: #4caf50; }

        /* STATS GRID */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 8px;
            font-size: 0.85rem;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-secondary);
        }

        .stat-value {
            color: var(--text-primary);
            font-weight: bold;
            margin-left: auto;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        /* TOOLTIP */
        #tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.9);
            border: 1px solid #444;
            color: #fff;
            padding: 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            pointer-events: none;
            display: none;
            z-index: 1000;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        /* RESPONSIVE */
        @media (max-width: 600px) {
            h1 { font-size: 0.9rem; }
            .slider-container { width: 70px; }
            button { width: 32px; height: 32px; }
            #statsPanel { padding: 10px; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
        }
    </style>
</head>
<body>

<header>
    <h1>
        <a href="index.html" class="back-link">← Volver</a>
        BATTLE ROYALE (WORKER)
    </h1>
    <div class="controls">
        <span class="money-counter" id="totalMoney">0€</span>
        <div class="slider-container" title="Velocidad de Simulación">
            <input type="range" id="speedSlider" min="100" max="10000" step="100" value="1000">
        </div>
        <div class="btn-group">
            <button id="playPauseBtn" title="Iniciar/Pausar">
                <!-- Play Icon -->
                <svg id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                <!-- Pause Icon (hidden by default) -->
                <svg id="icon-pause" viewBox="0 0 24 24" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
            </button>
            <button id="resetBtn" title="Reiniciar">
                <!-- Reset Icon -->
                <svg viewBox="0 0 24 24"><path d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z"/></svg>
            </button>
            <button id="statsBtn" title="Ver Estadísticas">
                <!-- Stats Icon -->
                <svg viewBox="0 0 24 24"><path d="M10 20h4V4h-4v16zm-6 0h4v-8H4v8zM16 9v11h4V9h-4z"/></svg>
            </button>
        </div>
    </div>
</header>

<main>
    <canvas id="gameCanvas"></canvas>
    <div id="tooltip"></div>
</main>

<div id="statsPanel">
    <div class="stats-header">
        <span class="match-counter">Matches: <span id="matchCount">0</span></span>
    </div>

    <div class="progress-container">
        <div id="pb-ruined" class="progress-bar pb-ruined" style="width: 0%"></div>
        <div id="pb-losing" class="progress-bar pb-losing" style="width: 0%"></div>
        <div id="pb-neutral" class="progress-bar pb-neutral" style="width: 100%"></div>
        <div id="pb-winning" class="progress-bar pb-winning" style="width: 0%"></div>
    </div>

    <div class="stats-grid">
        <div class="stat-item"><span class="dot" style="background:#37474f"></span>Arruinados (0€)<span class="stat-value" id="stat-ruined">0 (0%)</span></div>
        <div class="stat-item"><span class="dot" style="background:#ff9800"></span>Perdiendo (<900)<span class="stat-value" id="stat-losing">0 (0%)</span></div>
        <div class="stat-item"><span class="dot" style="background:#ffeb3b"></span>Neutro (900-1100)<span class="stat-value" id="stat-neutral">0 (0%)</span></div>
        <div class="stat-item"><span class="dot" style="background:#4caf50"></span>Ganando (>1100)<span class="stat-value" id="stat-winning">0 (0%)</span></div>
        <div class="stat-item"><span class="dot" style="background:#00e676"></span>x2 (>2k)<span class="stat-value" id="stat-x2">0 (0%)</span></div>
        <div class="stat-item"><span class="dot" style="background:#2196f3"></span>x3 (>3k)<span class="stat-value" id="stat-x3">0 (0%)</span></div>
        <div class="stat-item"><span class="dot" style="background:#f44336"></span>x5 (>5k)<span class="stat-value" id="stat-x5">0 (0%)</span></div>
        <div class="stat-item"><span class="dot" style="background:#ff00ff"></span>x10 (>10k)<span class="stat-value" id="stat-x10">0 (0%)</span></div>
    </div>
</div>

<script>
    // Constants
    const BANK_COLORS = {
        BLACK: '#000000', // Ruined
        ORANGE: '#ff9800', // Losing (<900)
        YELLOW: '#ffeb3b', // Neutral (901-1099)
        GREEN_NORMAL: '#4caf50', // Winning (>1100)
        GREEN_HIGHLIGHT: '#00e676', // x2
        BLUE: '#2196f3', // x3
        RED: '#f44336', // x5
        FUCHSIA: '#ff00ff' // x10
    };

    // State
    let localPlayers = []; // { id, bank, visualBank, active, ruinedAt }
    let matchCount = 0;
    let isPlaying = false;
    let animationId;
    let lastUITime = 0;

    // Worker
    const worker = new Worker('worker.js');

    // DOM Elements
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const resetBtn = document.getElementById('resetBtn');
    const statsBtn = document.getElementById('statsBtn');
    const speedSlider = document.getElementById('speedSlider');
    const matchCountEl = document.getElementById('matchCount');
    const totalMoneyEl = document.getElementById('totalMoney');
    const tooltip = document.getElementById('tooltip');

    // Icons
    const iconPlay = document.getElementById('icon-play');
    const iconPause = document.getElementById('icon-pause');

    // Stats Elements
    const statEls = {
        ruined: document.getElementById('stat-ruined'),
        losing: document.getElementById('stat-losing'),
        neutral: document.getElementById('stat-neutral'),
        winning: document.getElementById('stat-winning'),
        x2: document.getElementById('stat-x2'),
        x3: document.getElementById('stat-x3'),
        x5: document.getElementById('stat-x5'),
        x10: document.getElementById('stat-x10')
    };

    // Progress Bars
    const pbEls = {
        ruined: document.getElementById('pb-ruined'),
        losing: document.getElementById('pb-losing'),
        neutral: document.getElementById('pb-neutral'),
        winning: document.getElementById('pb-winning')
    };

    // Worker Message Handling
    worker.onmessage = function(e) {
        const data = e.data;
        if (data.type === 'UPDATE') {
            matchCount = data.matchCount;
            updateLocalPlayers(data.players);

            const now = performance.now();
            if (now - lastUITime > 66) {
                updateUI();
                lastUITime = now;
            }
        } else if (data.type === 'HISTORY') {
            // Save history and navigate
            const dataToSave = {
                history: data.history,
                rounds: data.rounds,
                ids: data.ids
            };
            try {
                localStorage.setItem('seguimientoData', JSON.stringify(dataToSave));
                window.location.href = 'seguimiento.html';
            } catch (err) {
                console.error("Error saving stats:", err);
                alert("Error al guardar datos de seguimiento.");
            }
        }
    };

    function updateLocalPlayers(workerPlayers) {
        if (localPlayers.length === 0) {
            // Initialize
            localPlayers = workerPlayers.map(p => ({
                id: p.id,
                bank: p.bank,
                visualBank: p.bank,
                active: p.active,
                ruinedAt: p.ruinedAt,
                maxBank: p.maxBank
            }));
        } else {
            // Update existing
            for (let i = 0; i < localPlayers.length; i++) {
                const wp = workerPlayers[i];
                const lp = localPlayers[i];
                lp.bank = wp.bank;
                lp.active = wp.active;
                lp.ruinedAt = wp.ruinedAt;
                lp.maxBank = wp.maxBank;
            }
        }
    }

    function toggleGame() {
        isPlaying = !isPlaying;
        if (isPlaying) {
            iconPlay.style.display = 'none';
            iconPause.style.display = 'block';
            playPauseBtn.classList.add('active');
            worker.postMessage({ type: 'START' });
        } else {
            iconPlay.style.display = 'block';
            iconPause.style.display = 'none';
            playPauseBtn.classList.remove('active');
            worker.postMessage({ type: 'STOP' });
        }
    }

    function resetGame() {
        isPlaying = false;
        iconPlay.style.display = 'block';
        iconPause.style.display = 'none';
        playPauseBtn.classList.remove('active');
        worker.postMessage({ type: 'RESET' });

        // Reset local visual state immediately
        matchCount = 0;
        matchCountEl.textContent = '0';
        localPlayers = []; // Force re-initialization on next update for instant reset
    }

    // Animation Loop for Smooth Rendering
    function renderLoop() {
        // Interpolation
        for (let i = 0; i < localPlayers.length; i++) {
            const p = localPlayers[i];
            p.visualBank += (p.bank - p.visualBank) * 0.1;
        }

        draw();
        requestAnimationFrame(renderLoop);
    }

    function updateUI() {
        matchCountEl.textContent = matchCount.toLocaleString();

        let stats = {
            ruined: 0,
            losing: 0,
            neutral: 0,
            winning: 0,
            x2: 0,
            x3: 0,
            x5: 0,
            x10: 0
        };

        let totalMoney = 0;

        for (const p of localPlayers) {
            totalMoney += p.bank;
            if (p.bank <= 0) stats.ruined++;
            else if (p.bank <= 900) stats.losing++;
            else if (p.bank <= 1099) stats.neutral++;
            else stats.winning++;

            if (p.bank >= 2000) stats.x2++;
            if (p.bank >= 3000) stats.x3++;
            if (p.bank >= 5000) stats.x5++;
            if (p.bank >= 10000) stats.x10++;
        }

        totalMoneyEl.textContent = totalMoney.toLocaleString() + '€';

        const total = localPlayers.length || 1; // Avoid division by zero

        const getPct = (val) => Math.round((val / total) * 100);

        statEls.ruined.textContent = `${stats.ruined} (${getPct(stats.ruined)}%)`;
        statEls.losing.textContent = `${stats.losing} (${getPct(stats.losing)}%)`;
        statEls.neutral.textContent = `${stats.neutral} (${getPct(stats.neutral)}%)`;
        statEls.winning.textContent = `${stats.winning} (${getPct(stats.winning)}%)`;
        statEls.x2.textContent = `${stats.x2} (${getPct(stats.x2)}%)`;
        statEls.x3.textContent = `${stats.x3} (${getPct(stats.x3)}%)`;
        statEls.x5.textContent = `${stats.x5} (${getPct(stats.x5)}%)`;
        statEls.x10.textContent = `${stats.x10} (${getPct(stats.x10)}%)`;

        const pctRuined = (stats.ruined / total) * 100;
        const pctLosing = (stats.losing / total) * 100;
        const pctNeutral = (stats.neutral / total) * 100;
        const pctWinning = (stats.winning / total) * 100;

        pbEls.ruined.style.width = pctRuined + '%';
        pbEls.losing.style.width = pctLosing + '%';
        pbEls.neutral.style.width = pctNeutral + '%';
        pbEls.winning.style.width = pctWinning + '%';
    }

    const COLS = 40;
    const ROWS = 25;

    function getColor(bank) {
        if (bank <= 0) return BANK_COLORS.BLACK;
        if (bank <= 900) return BANK_COLORS.ORANGE;
        if (bank <= 1099) return BANK_COLORS.YELLOW;
        if (bank < 2000) return BANK_COLORS.GREEN_NORMAL;
        if (bank < 3000) return BANK_COLORS.GREEN_HIGHLIGHT;
        if (bank < 5000) return BANK_COLORS.BLUE;
        if (bank < 10000) return BANK_COLORS.RED;
        return BANK_COLORS.FUCHSIA;
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const cellWidth = canvas.width / COLS;
        const cellHeight = canvas.height / ROWS;
        const padding = 1;

        for (let i = 0; i < localPlayers.length; i++) {
            const p = localPlayers[i];
            const col = i % COLS;
            const row = Math.floor(i / COLS);

            const x = col * cellWidth;
            const y = row * cellHeight;

            if (p.bank <= 0) {
                ctx.fillStyle = BANK_COLORS.BLACK;
            } else {
                ctx.fillStyle = getColor(p.visualBank);
            }

            ctx.fillRect(x + padding, y + padding, Math.max(0, cellWidth - padding * 2), Math.max(0, cellHeight - padding * 2));
        }
    }

    function resizeCanvas() {
        const parent = canvas.parentElement;
        if (parent.clientWidth > 0 && parent.clientHeight > 0) {
            canvas.width = parent.clientWidth;
            canvas.height = parent.clientHeight;
            draw();
        }
    }

    // Interaction
    function handleInteraction(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        const mouseX = clientX - rect.left;
        const mouseY = clientY - rect.top;

        const cellWidth = canvas.width / COLS;
        const cellHeight = canvas.height / ROWS;

        const col = Math.floor(mouseX / cellWidth);
        const row = Math.floor(mouseY / cellHeight);
        const index = row * COLS + col;

        if (index >= 0 && index < localPlayers.length) {
            const p = localPlayers[index];
            tooltip.style.display = 'block';

            let tooltipX = clientX + 15;
            let tooltipY = clientY + 15;

            if (tooltipX + 150 > window.innerWidth) tooltipX = clientX - 160;
            if (tooltipY + 100 > window.innerHeight) tooltipY = clientY - 110;

            tooltip.style.left = tooltipX + 'px';
            tooltip.style.top = tooltipY + 'px';

            tooltip.textContent = '';
            const title = document.createElement('strong');
            title.style.color = 'var(--accent-color)';
            title.textContent = `Agente #${p.id}`;
            tooltip.appendChild(title);
            tooltip.appendChild(document.createElement('br'));
            tooltip.appendChild(document.createTextNode(`Banca: ${p.bank}€`));
            if (p.bank <= 0) {
                tooltip.appendChild(document.createElement('br'));
                const ruinedSpan = document.createElement('span');
                ruinedSpan.style.color = 'var(--danger-color)';
                ruinedSpan.textContent = `Arruinado (Ronda ${p.ruinedAt})`;
                tooltip.appendChild(ruinedSpan);
            }
        } else {
            tooltip.style.display = 'none';
        }
    }

    canvas.addEventListener('mousemove', (e) => handleInteraction(e.clientX, e.clientY));
    canvas.addEventListener('click', (e) => handleInteraction(e.clientX, e.clientY));
    canvas.addEventListener('touchstart', (e) => {
        if (e.touches.length > 0) handleInteraction(e.touches[0].clientX, e.touches[0].clientY);
    }, {passive: true});
    canvas.addEventListener('mouseleave', () => tooltip.style.display = 'none');

    // Controls
    playPauseBtn.addEventListener('click', toggleGame);
    resetBtn.addEventListener('click', resetGame);

    // Slider
    speedSlider.addEventListener('input', (e) => {
        const val = parseInt(e.target.value, 10);
        worker.postMessage({ type: 'SPEED', value: val });
    });

    // Stats
    statsBtn.addEventListener('click', () => {
        if (isPlaying) toggleGame(); // Pause
        worker.postMessage({ type: 'GET_HISTORY' });
    });

    window.addEventListener('resize', resizeCanvas);

    // Init
    worker.postMessage({ type: 'INIT' });
    setTimeout(resizeCanvas, 50);
    requestAnimationFrame(renderLoop);
</script>
</body>
</html>
