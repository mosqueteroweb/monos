<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seguimiento - Battle Royale</title>
    <!-- Chart.js via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0a0;
            --accent-color: #bb86fc;
            --success-color: #00e676;
            --danger-color: #ff1744;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-primary);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background-color: var(--surface-color);
            padding: 10px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
            z-index: 100;
        }

        h1 {
            font-size: 1.1rem;
            font-weight: 700;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
            flex-grow: 1;
        }

        button {
            background: #2c2c2c;
            border: 1px solid #444;
            color: var(--text-primary);
            border-radius: 6px;
            padding: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            width: 36px;
            height: 36px;
        }

        button:hover {
            background: #3d3d3d;
            border-color: #666;
        }

        button svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        main {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .chart-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 1200px;
            max-height: 80vh;
            background: var(--surface-color);
            border-radius: 8px;
            padding: 10px;
            box-sizing: border-box;
        }

        .no-data {
            color: var(--text-secondary);
            font-size: 1.2rem;
            text-align: center;
        }
    </style>
</head>
<body>

<header>
    <button id="backBtn" title="Volver">
        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    </button>
    <h1>Seguimiento</h1>
    <div style="width: 36px"></div> <!-- Spacer for balance -->
</header>

<main>
    <div class="chart-wrapper">
        <canvas id="trackingChart"></canvas>
    </div>
</main>

<script>
    const backBtn = document.getElementById('backBtn');
    const ctx = document.getElementById('trackingChart').getContext('2d');

    // Navigation
    const urlParams = new URLSearchParams(window.location.search);
    const fromPage = urlParams.get('from');

    backBtn.addEventListener('click', () => {
        if (fromPage === 'webworker.html') {
            window.location.href = 'webworker.html';
        } else {
            window.location.href = 'index.html';
        }
    });

    // Load Data
    const rawData = localStorage.getItem('seguimientoData');

    if (!rawData) {
        document.querySelector('.chart-wrapper').innerHTML = '<div class="no-data">No hay datos de seguimiento disponibles.<br>Juega una partida primero.</div>';
    } else {
        const data = JSON.parse(rawData);
        const history = data.history; // { id: [val1, val2...], ... }
        const ids = data.ids;
        // The number of labels should match the longest history
        // However, all tracked players should have roughly the same history length
        // (give or take 1 if game ended mid-loop, but likely identical)

        const maxLength = Math.max(...Object.values(history).map(arr => arr.length));

        // Sampling for performance if too many points
        // Chart.js can handle a lot, but 100k might be sluggish on mobile.
        // Let's sample down to ~2000 points max for display.
        const sampleRate = Math.max(1, Math.floor(maxLength / 2000));

        const labels = [];
        for (let i = 0; i < maxLength; i += sampleRate) {
            labels.push(i);
        }

        const datasets = [];
        const colors = [
            '#00ffff', // Cyan
            '#ff9800', // Orange
            '#e040fb', // Purple
            '#00e676'  // Green
        ];

        ids.forEach((id, index) => {
            const playerHistory = history[id];
            const sampledData = [];
            for (let i = 0; i < playerHistory.length; i += sampleRate) {
                sampledData.push(playerHistory[i]);
            }

            datasets.push({
                label: 'Jugador ' + id,
                data: sampledData,
                borderColor: colors[index % colors.length],
                backgroundColor: 'transparent',
                borderWidth: 2,
                pointRadius: 0, // Hide points for cleaner line
                tension: 0.1
            });
        });

        // Initialize Chart
        Chart.defaults.color = '#a0a0a0';
        Chart.defaults.borderColor = '#333';

        new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: datasets
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                interaction: {
                    mode: 'index',
                    intersect: false,
                },
                plugins: {
                    legend: {
                        labels: {
                            color: '#e0e0e0',
                            font: { size: 12 }
                        }
                    },
                    tooltip: {
                        backgroundColor: 'rgba(0, 0, 0, 0.9)',
                        titleColor: '#fff',
                        bodyColor: '#e0e0e0',
                        callbacks: {
                            title: (context) => 'Ronda ' + context[0].label
                        }
                    }
                },
                scales: {
                    x: {
                        title: {
                            display: true,
                            text: 'Ronda',
                            color: '#a0a0a0'
                        },
                        ticks: {
                            maxTicksLimit: 10
                        }
                    },
                    y: {
                        title: {
                            display: true,
                            text: 'Banca (€)',
                            color: '#a0a0a0'
                        },
                        grid: {
                            color: '#333'
                        }
                    }
                },
                animation: false // Disable animation for large datasets for better perf
            }
        });
    }
</script>
</body>
</html>
